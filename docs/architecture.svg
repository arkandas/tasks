<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 511" width="960" height="511" role="img" aria-labelledby="title desc">
  <title id="title">Tasks architecture</title>
  <desc id="desc">The React client in the browser calls the Next.js server's API routes. src/proxy.ts checks the session first. The API routes store and search boards, sections, tasks, to-do items, sticky notes and users in PostgreSQL through Prisma, and only touch rows that belong to the signed-in user. NextAuth handles sign-in. When the container starts, prisma db push creates or updates the tables.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#047857"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .col { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #8f8878; }
      .title { font-size: 15px; font-weight: 600; fill: #24211b; }
      .body { font-size: 12.5px; fill: #66604f; }
      .path { font-size: 12px; fill: #047857; }
      .label { font-size: 11px; fill: #8f8878; }
      .box { fill: #fffefb; stroke: #dcd5c6; stroke-width: 1; }
      .arrow { stroke: #047857; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="511" rx="16" fill="#f2efe7"/>

  <text class="sans col" x="24" y="36">BROWSER</text>
  <text class="sans col" x="354" y="36">NEXT.JS SERVER</text>
  <text class="sans col" x="724" y="36">STORAGE</text>

  <rect class="box" x="24" y="52" width="250" height="435" rx="10"/>
  <text class="sans title" x="42" y="80">React client</text>
  <text class="sans body" x="42" y="106">Boards, sections and tasks</text>
  <text class="sans body" x="42" y="130">To-do list</text>
  <text class="sans body" x="42" y="154">Sticky note board and trash</text>
  <text class="sans body" x="42" y="250">Search</text>
  <text class="sans body" x="42" y="178">Drag and drop (dnd-kit)</text>
  <text class="sans body" x="42" y="202">Markdown (react-markdown)</text>
  <text class="sans body" x="42" y="226">Light and dark theme</text>
  <text class="sans title" x="42" y="292">Pages</text>
  <text class="mono path" x="42" y="318">/</text>
  <text class="sans body" x="112" y="318">boards, to-dos, notes</text>
  <text class="mono path" x="42" y="340">/login</text>
  <text class="sans body" x="112" y="340">sign in</text>
  <text class="mono path" x="42" y="362">/setup</text>
  <text class="sans body" x="112" y="362">first account</text>

  <rect class="box" x="354" y="52" width="290" height="84" rx="10"/>
  <text class="mono title" x="372" y="80">src/proxy.ts</text>
  <text class="sans body" x="372" y="104">Checks the session cookie</text>
  <text class="sans body" x="372" y="122">No session: redirect to /login</text>

  <rect class="box" x="354" y="156" width="290" height="227" rx="10"/>
  <text class="sans title" x="372" y="184">API routes</text>
  <text class="mono path" x="372" y="210">/api/boards</text>
  <text class="sans body" x="506" y="210">boards, order</text>
  <text class="mono path" x="372" y="231">/api/sections</text>
  <text class="sans body" x="506" y="231">sections</text>
  <text class="mono path" x="372" y="252">/api/tasks</text>
  <text class="sans body" x="506" y="252">tasks, moves</text>
  <text class="mono path" x="372" y="273">/api/todos</text>
  <text class="sans body" x="506" y="273">to-do items, order</text>
  <text class="mono path" x="372" y="294">/api/stickynotes</text>
  <text class="sans body" x="506" y="294">notes, trash</text>
  <text class="mono path" x="372" y="315">/api/search</text>
  <text class="sans body" x="506" y="315">tasks, to-dos, notes</text>
  <text class="mono path" x="372" y="336">/api/users</text>
  <text class="sans body" x="506" y="336">accounts</text>
  <text class="sans body" x="372" y="365">Queries are scoped to the signed-in user</text>

  <rect class="box" x="354" y="403" width="290" height="84" rx="10"/>
  <text class="sans title" x="372" y="431">NextAuth</text>
  <text class="mono path" x="450" y="431">/api/auth</text>
  <text class="sans body" x="372" y="455">Username and password, bcrypt</text>
  <text class="sans body" x="372" y="473">JWT session cookie</text>

  <rect class="box" x="724" y="52" width="212" height="236" rx="10"/>
  <text class="sans title" x="742" y="80">PostgreSQL</text>
  <text class="mono path" x="742" y="112">users</text>
  <text class="mono path" x="742" y="136">boards</text>
  <text class="mono path" x="742" y="160">sections</text>
  <text class="mono path" x="742" y="184">tasks</text>
  <text class="mono path" x="742" y="208">comments</text>
  <text class="mono path" x="742" y="232">stickynotes</text>
  <text class="mono path" x="742" y="256">todoitems</text>

  <rect class="box" x="724" y="351" width="212" height="136" rx="10"/>
  <text class="sans title" x="742" y="379">Container start</text>
  <text class="mono path" x="742" y="405">start.sh</text>
  <text class="sans body" x="742" y="429">prisma db push creates and</text>
  <text class="sans body" x="742" y="447">updates the tables, then the</text>
  <text class="sans body" x="742" y="465">server starts</text>

  <line class="arrow" x1="276" y1="94" x2="352" y2="94" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="sans label" x="314" y="86" text-anchor="middle">fetch</text>
  <text class="mono label" x="314" y="110" text-anchor="middle">/api/*</text>

  <line class="arrow" x1="499" y1="137" x2="499" y2="154" marker-end="url(#head)"/>

  <line class="arrow" x1="646" y1="190" x2="722" y2="190" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="sans label" x="684" y="182" text-anchor="middle">Prisma</text>

  <line class="arrow" x1="830" y1="349" x2="830" y2="290" marker-end="url(#head)"/>
  <text class="sans label" x="840" y="324">schema</text>
</svg>
